# ---------------------------------------------------------------
# Perfil de producción (Render + Aiven MySQL)
# Se activa con SPRING_PROFILES_ACTIVE=prod. Solo sobrescribe lo que cambia
# respecto a application.properties.
#
# Variables de entorno obligatorias:
#   DB_URL       jdbc:mysql://<host>:<puerto>/barberia_el_padrino?sslMode=REQUIRED&serverTimezone=America/Lima
#   DB_USERNAME  usuario de Aiven (p. ej. avnadmin)
#   DB_PASSWORD  contraseña de Aiven
# ---------------------------------------------------------------

# Sin valores por defecto: si falta una variable, la aplicación no arranca (mejor que conectarse a localhost)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El plan gratuito de Aiven limita las conexiones simultáneas; la app no necesita más
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=120000

# Render termina HTTPS en su proxy; así Spring genera URLs y redirecciones con https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# No exponer detalles internos de las excepciones en producción
server.error.include-message=never
server.error.include-stacktrace=never

server.compression.enabled=true
spring.web.resources.cache.period=7d
