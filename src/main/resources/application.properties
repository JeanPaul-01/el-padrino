spring.application.name=el-padrino
server.port=${PORT:8080}

# ---------------------------------------------------------------
# Base de datos MySQL
# 1) Ejecute database/BD_BarberiaElPadrino.sql.sql y luego database/datos_prueba.sql
# 2) Los valores después de ":" son los de desarrollo local. En la nube se
#    reemplazan con las variables de entorno DB_URL, DB_USERNAME y DB_PASSWORD.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barberia_el_padrino?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:elpadrino_app}
spring.datasource.password=${DB_PASSWORD:elpadrino_app}

# JPA / Hibernate: valida que las entidades coincidan con las tablas del script
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

# Vistas JSP (src/main/webapp/WEB-INF/views)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

server.servlet.session.timeout=30m
server.error.include-message=always
